<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 자료실 로그인</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }

    .auth-panel {
      margin: 24px 0;
      padding: 20px;
      border: 1px solid #51667c;
      border-radius: 14px;
      background: #162437;
    }

    .auth-panel h2 {
      margin: 0 0 16px;
      font-size: 20px;
    }

    .auth-form {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      color: #bfd0e5;
      font-size: 14px;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #51667c;
      border-radius: 9px;
      background: #101a28;
      color: #ecf4ff;
      font: inherit;
    }

    button {
      width: fit-content;
      padding: 10px 16px;
      border: 0;
      border-radius: 9px;
      background: #8ad8df;
      color: #101a28;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .6;
    }

    .auth-status {
      margin: 12px 0 0;
      color: #bfd0e5;
      font-size: 15px;
    }

    .auth-error {
      min-height: 1.4em;
      margin: 10px 0 0;
      color: #ffb7c3;
      font-size: 14px;
    }

    .notice {
      margin: 26px 0;
      padding: 18px;
      border: 1px solid #d07384;
      border-radius: 14px;
      color: #ffe3e8;
      background: #612a3544;
    }

    ul {
      list-style: none;
      display: grid;
      gap: 12px;
      padding: 0;
    }

    li {
      border: 1px solid #51667c;
      border-radius: 14px;
      padding: 17px 19px;
      background: #1a2a3d;
    }

    strong {
      display: block;
      font-size: 18px;
      margin-bottom: 5px;
    }

    li span {
      color: #bfd0e5;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 로그인</div>

    <h1>자료실 로그인</h1>

    <p>
      Supabase Auth로 로그인 상태를 확인하고,
      로그인한 요청만 자료 API에 접근할 수 있습니다.
    </p>

    <section class="auth-panel" aria-labelledby="auth-title">
      <h2 id="auth-title">계정</h2>

      <form id="login-form" class="auth-form">
        <label>
          이메일
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            required
          >
        </label>

        <label>
          비밀번호
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          >
        </label>

        <button id="login-button" type="submit">로그인</button>
      </form>

      <div id="logged-in" hidden>
        <p id="auth-status" class="auth-status"></p>
        <button id="logout-button" type="button">로그아웃</button>
      </div>

      <p id="auth-error" class="auth-error" role="alert"></p>
    </section>

    <div class="notice">
      자료 API는 로그인 토큰을 확인합니다.
      로그인하지 않은 요청에는 가상 자료를 반환하지 않습니다.
    </div>

    <ul id="notes" aria-live="polite">
      <li>로그인 후 가상 자료를 확인할 수 있습니다.</li>
    </ul>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm';

    const SUPABASE_URL = 'https://vcckkpclsyokvlhwtvej.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_EA6DhbsC2mE_Wh0MjtFUIg_HosNsTC1';

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const loginForm = document.querySelector('#login-form');
    const emailInput = document.querySelector('#email');
    const passwordInput = document.querySelector('#password');
    const loginButton = document.querySelector('#login-button');
    const loggedIn = document.querySelector('#logged-in');
    const authStatus = document.querySelector('#auth-status');
    const authError = document.querySelector('#auth-error');
    const logoutButton = document.querySelector('#logout-button');
    const list = document.querySelector('#notes');

    function showLoggedOut() {
      loginForm.hidden = false;
      loggedIn.hidden = true;
      authStatus.textContent = '';
      passwordInput.value = '';
    }

    function showLoggedIn(user) {
      loginForm.hidden = true;
      loggedIn.hidden = false;
      authStatus.textContent = user?.email
        ? `${user.email} 계정으로 로그인되어 있습니다.`
        : '로그인되어 있습니다.';
      passwordInput.value = '';
    }

    function showAuthError(message) {
      authError.textContent = message || '';
    }

    function showNotesMessage(message) {
      const item = document.createElement('li');
      item.textContent = message;
      list.replaceChildren(item);
    }

    function renderNotes(notes) {
      list.replaceChildren(...notes.map(note => {
        const item = document.createElement('li');
        const title = document.createElement('strong');
        const content = document.createElement('span');

        title.textContent = note.title;
        content.textContent = note.content;

        item.append(title, content);
        return item;
      }));
    }

    async function loadNotes(session) {
      if (!session?.access_token) {
        showNotesMessage('로그인 후 가상 자료를 확인할 수 있습니다.');
        return;
      }

      showNotesMessage('가상 자료를 불러오는 중입니다.');

      try {
        const response = await fetch('/api/notes', {
          cache: 'no-store',
          headers: {
            Authorization: `Bearer ${session.access_token}`,
          },
        });

        let data = null;

        try {
          data = await response.json();
        } catch {
          throw new Error('자료 API 응답 형식이 올바르지 않습니다.');
        }

        if (!response.ok) {
          throw new Error(
            typeof data?.error === 'string'
              ? data.error
              : '자료를 읽을 수 없습니다.'
          );
        }

        if (!Array.isArray(data.notes)) {
          throw new Error('자료 형식이 맞지 않습니다.');
        }

        renderNotes(data.notes);
      } catch (error) {
        showNotesMessage(error.message);
      }
    }

    async function applySession(session) {
      showAuthError('');

      if (session?.user) {
        showLoggedIn(session.user);
      } else {
        showLoggedOut();
      }

      await loadNotes(session);
    }

    async function syncAuthState() {
      const { data, error } = await supabase.auth.getSession();

      if (error) {
        showLoggedOut();
        showAuthError(error.message);
        showNotesMessage('로그인 후 가상 자료를 확인할 수 있습니다.');
        return;
      }

      await applySession(data.session);
    }

    loginForm.addEventListener('submit', async event => {
      event.preventDefault();

      showAuthError('');
      loginButton.disabled = true;

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: emailInput.value,
          password: passwordInput.value,
        });

        if (error) {
          showLoggedOut();
          showAuthError(error.message);
          showNotesMessage('로그인 후 가상 자료를 확인할 수 있습니다.');
          return;
        }

        await applySession(data.session);
      } catch {
        showLoggedOut();
        showAuthError('로그인 요청을 처리할 수 없습니다.');
        showNotesMessage('로그인 후 가상 자료를 확인할 수 있습니다.');
      } finally {
        loginButton.disabled = false;
      }
    });

    logoutButton.addEventListener('click', async () => {
      showAuthError('');
      logoutButton.disabled = true;

      try {
        const { error } = await supabase.auth.signOut();

        if (error) {
          showAuthError(error.message);
          return;
        }

        await applySession(null);
      } catch {
        showAuthError('로그아웃 요청을 처리할 수 없습니다.');
      } finally {
        logoutButton.disabled = false;
      }
    });

    supabase.auth.onAuthStateChange((_event, session) => {
      void applySession(session);
    });

    await syncAuthState();
  </script>
</body>
</html>
