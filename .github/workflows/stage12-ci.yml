name: Stage 12 integrated checkpoint tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:stage12
      - run: npm run decider:test
      - run: npm run detect:test
      - run: npm run fixture:7
      - run: npm run build -- --local
      # Clean checkout has no gitignored bundle-notes.json.
      - run: npm run bundle
      - run: node -e "const s=require('./artifacts/submission.json'); if(s.step!==12||s.attackAttempts.length!==13||s.attackAttempts.filter(x=>x.observed==='not_run').length!==9)process.exit(1)"
