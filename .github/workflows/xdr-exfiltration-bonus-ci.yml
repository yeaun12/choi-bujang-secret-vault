name: XDR-06 bonus checkpoint
on:
  pull_request:
    branches: [main]
    paths:
      - 'xdr/exfiltration/**'
      - 'xdr/README.md'
      - 'README.md'
      - 'scripts/xdr-run-exfiltration.mjs'
      - 'test/xdr-exfiltration-bonus.test.mjs'
      - 'package.json'
      - '.github/workflows/xdr-exfiltration-bonus-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run xdr:test
      - run: npm run test:stage12
      - run: npm run decider:test
      - run: npm run detect:test
      - run: npm run build -- --local
      - run: npm run xdr:exfiltration:read
      - run: npm run xdr:run -- exfiltration
      - name: Validate official-shaped 10/10/10 replay
        run: node -e "const r=require('./xdr/exfiltration/result.json'); if(r.schema!=='aleph.xdr.result.v1'||r.moduleKey!=='exfiltration'||r.decisions.length!==30||r.counts.block!==10||r.counts.alert!==10||r.counts.record!==10)process.exit(1); console.log(r.counts)"
      - run: npm run xdr:exfiltration:replay
