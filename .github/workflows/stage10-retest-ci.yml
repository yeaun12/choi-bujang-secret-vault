name: Stage 10 recovery tests

on:
  push:
    branches:
      - stage10-http-retest-proof-oct14
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run complete stage 10 suite
        run: npm run test:stage10
      - name: Generate submission bundle
        run: npm run bundle
