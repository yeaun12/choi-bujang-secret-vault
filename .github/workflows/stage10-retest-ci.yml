name: Stage 10 recovery tests

on:
  push:
    branches:
      - stage10-http-retest-proof-oct14
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use the actual PR head; GitHub's synthetic merge commit is not
          # a valid Stage 10 submission checkpoint for bundle.mjs.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run complete stage 10 suite
        run: npm run test:stage10
      - name: Explain local-only submission bundle
        run: echo 'Bundle generation is intentionally local-only because bundle-notes.json is ignored and user-owned. Run npm run bundle on the local checkout before submitting.'
